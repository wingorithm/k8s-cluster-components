apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Values.environment.namespace }}
  labels:
    app: {{ .Values.service.name }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gatewayName }}
      namespace: {{ .Values.ingress.gatewayNamespace }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/logservice
      backendRefs:
        - name: {{ .Values.service.name }}
          port: {{ .Values.service.port }}